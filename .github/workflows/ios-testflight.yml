name: iOS TestFlight

# WHY THIS EXISTS (2026-10-09, 계획 B1-3 — docs/planning/17-app-release-plan.md)
# ---------------------------------------------------------------------------
# 이 팀에는 Mac 이 없다. 서명된 iOS 앱을 만들어 App Store Connect(TestFlight)에 올리는 일을 GitHub 의 macOS 러너가 한다.
# 인증서 · 프로비저닝 파일을 손으로 만들지 않는다 — App Store Connect API 키로 Xcode 의 **클라우드 관리 서명**(-allowProvisioningUpdates)을 쓴다.
#
# 준비(Apple Developer 가입 A2 뒤, 한 번만): docs/engineering/03-deployment-strategy.md 「iOS TestFlight 업로드」
#   저장소 Settings → Secrets and variables → Actions 에 4개:
#   APPLE_TEAM_ID        — Membership 의 Team ID(10자)
#   ASC_KEY_ID           — App Store Connect → Users and Access → Integrations → App Store Connect API 키 ID (역할 Admin)
#   ASC_ISSUER_ID        — 같은 화면의 Issuer ID
#   ASC_KEY_P8_BASE64    — 내려받은 AuthKey_XXXX.p8 를 base64 로(한 줄)
#
# 실행: Actions → iOS TestFlight → Run workflow. 수동 실행만 한다(macOS 러너 비용 · 업로드는 사람이 정할 일).
# 빌드 번호는 project.pbxproj 의 CURRENT_PROJECT_VERSION(= Android versionCode 와 같은 값)을 쓴다. 같은 번호는 두 번 올릴 수 없다 —
# 다시 올릴 때는 두 곳을 함께 +1 해서 커밋하거나, 시험 업로드면 입력칸 build_number 로 덮어쓴다.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "빌드 번호 덮어쓰기(비우면 project.pbxproj 값)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing — see docs/engineering/03-deployment-strategy.md (iOS TestFlight 업로드)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve build number
        env:
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            BUILD="$OVERRIDE"
          else
            BUILD=$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' ios/App/App.xcodeproj/project.pbxproj | grep -o '[0-9]*$')
          fi
          echo "Build number: $BUILD"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Archive (signed, cloud-managed signing)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
