name: iOS build check

# WHY THIS EXISTS (2026-10-07, 계획 B1-3 — docs/planning/17-app-release-plan.md)
# ---------------------------------------------------------------------------
# 이 팀에는 Mac 이 없다. iOS 프로젝트(ios/App)를 손으로 고치면(Info.plist · 다국어 InfoPlist.strings ·
# PrivacyInfo.xcprivacy · project.pbxproj) 컴파일되는지 확인할 방법이 없어서, GitHub 의 macOS 러너에서
# **서명 없이 시뮬레이터용으로** 빌드만 해 본다. 실패하면 Xcode 프로젝트가 깨진 것이다.
#
# - 서명 · TestFlight 업로드는 하지 않는다 — Apple Developer 가입(A2) 후 별도 워크플로로 추가한다.
# - macOS 러너는 비공개 저장소에서 분당 비용이 리눅스의 10배라, iOS 관련 파일이 바뀔 때와 수동 실행만 돈다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "capacitor-www/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build-check.yml"

concurrency:
  group: ios-build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Build for simulator (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Check bundled localizations and privacy manifest
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/App.app' -type d | head -1)
          echo "App bundle: $APP"
          for f in en.lproj/InfoPlist.strings ko.lproj/InfoPlist.strings ja.lproj/InfoPlist.strings PrivacyInfo.xcprivacy; do
            test -e "$APP/$f" && echo "ok  $f" || { echo "MISSING $f"; exit 1; }
          done
